name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  # Queue rather than cancel. Cancelling a run in flight can leave a snapshot
  # image published with no release pointing at it, and can kill the release
  # job midway through writing a draft. Only one run waits at a time, so a
  # burst of pushes still collapses to the newest one.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.state.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether this version is already published
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//; s/".*//')
          TAG="v${VERSION}"
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")

          if [ "$IS_DRAFT" = "false" ]; then
            echo "$TAG is already published, nothing to build"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is not published yet, building"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    # A published release is final, so a push that still names it builds
    # nothing. package and release need this job, so they are skipped with it.
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.base }}
      image_tag: ${{ steps.image_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//; s/".*//')
          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: image_tag
        env:
          BASE: ${{ steps.version.outputs.base }}
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "tag=${BASE}-${SHORT_HASH}-snapshot" >> "$GITHUB_OUTPUT"

      - name: Install pack CLI
        uses: buildpacks/github-actions/setup-pack@324e5c43145b68f60bf74a269f5ba7b2969e03db # v6.2.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish OCI image
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          pack build ghcr.io/${{ github.repository }}:${IMAGE_TAG} \
            --buildpack paketo-community/rust \
            --builder paketobuildpacks/ubuntu-noble-builder \
            --run-image paketobuildpacks/ubuntu-noble-run-tiny \
            --cache-image ghcr.io/${{ github.repository }}:cache \
            --publish

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from image
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
          docker pull "$IMAGE"
          CONTAINER_ID=$(docker create "$IMAGE")
          docker export "$CONTAINER_ID" -o /tmp/container.tar
          docker rm "$CONTAINER_ID"

          BINARY_NAME="calendar-proxy"
          BINARY_PATH=$(tar -tf /tmp/container.tar | grep -E "bin/${BINARY_NAME}$" | head -1)
          if [ -z "$BINARY_PATH" ]; then
            echo "Binary not found in image" >&2
            exit 1
          fi
          tar -xf /tmp/container.tar -C /tmp "$BINARY_PATH"
          cp "/tmp/$BINARY_PATH" ./calendar-proxy

      - name: Compress binary
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: gzip -c calendar-proxy > calendar-proxy-${VERSION}.gz

      - name: Upload compressed artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calendar-proxy-${{ needs.build.outputs.version }}.gz
          path: calendar-proxy-${{ needs.build.outputs.version }}.gz

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download compressed artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: calendar-proxy-*.gz
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          TAG="v${VERSION}"
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          {
            echo "Release candidate for $TAG"
            echo ""
            echo "- Container image: \`${IMAGE}\`"
          } > notes.md

          STATE=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ "$STATE" = "true" ]; then
            echo "Updating existing draft release $TAG"
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" artifacts/* --clobber
          elif [ -z "$STATE" ]; then
            echo "Creating draft release $TAG"
            gh release create "$TAG" --draft \
              --title "calendar-proxy $TAG" \
              --notes-file notes.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Release $TAG is already published, leaving it alone"
          fi
