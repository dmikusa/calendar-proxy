name: Tag release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          SHORT_HASH=$(git rev-parse --short=7 "${TAG_NAME}^{commit}")
          echo "short_hash=${SHORT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: buildpacks/github-actions/setup-tools@91cb4574e7b781941b4e3fa950e541e4b8754b3a # v6.2.2

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag snapshot image as release version and latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_HASH: ${{ steps.version.outputs.short_hash }}
        run: |
          SNAPSHOT_TAG="${VERSION}-${SHORT_HASH}-snapshot"
          REPO="ghcr.io/${{ github.repository }}"
          echo "Tagging ${SNAPSHOT_TAG} as ${VERSION} and latest"
          crane tag "${REPO}:${SNAPSHOT_TAG}" "${VERSION}"
          crane tag "${REPO}:${SNAPSHOT_TAG}" "latest"
