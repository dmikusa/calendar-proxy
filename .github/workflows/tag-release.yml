name: Tag release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          SHORT_HASH=$(git rev-parse --short=7 "${TAG_NAME}^{commit}")
          echo "short_hash=${SHORT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: buildpacks/github-actions/setup-tools@c1c71086a0e89a65c04ea113390227fd7f05d9df # v6.0.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag snapshot image as release version and latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_HASH: ${{ steps.version.outputs.short_hash }}
        run: |
          SNAPSHOT_TAG="${VERSION}-${SHORT_HASH}-snapshot"
          REPO="ghcr.io/${{ github.repository }}"
          echo "Tagging ${SNAPSHOT_TAG} as ${VERSION} and latest"
          crane tag "${REPO}:${SNAPSHOT_TAG}" "${VERSION}"
          crane tag "${REPO}:${SNAPSHOT_TAG}" "latest"
